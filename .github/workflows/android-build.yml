name: Android CI Build

on:
  push:
    branches: [ "feature/minicpm-v-integration" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive # 确保 llama.cpp 被正确拉取

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Android SDK
      uses: amyu/setup-android@v5
      with:
        cache-disabled: true
        sdk-version: 35
        ndk-version: 26.3.11579264
        cmake-version: 3.22.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Debug APK)
      run: ./gradlew --no-daemon assembleDebug --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: manga-translator-minicpm-v-debug
        path: app/build/outputs/apk/debug/app-debug.apk
